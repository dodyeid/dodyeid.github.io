<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Puzzle Maker</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#131a23; --panel2:#182130; --line:#243040;
    --text:#e9eef5; --dim:#8fa1b3; --faint:#5d6f83;
    --accent:#ff9bf5; --good:#3fc97f; --bad:#ff6b81; --warn:#ffc93c;
    --trivial:#ff9bf5; --popsicle:#3ddbd9; --sportle:#ffc93c; --literal:#b095ff; --global:#6e9bff;
    --app:#110f32; --appbtn:#1c194c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .hidden{display:none !important}
  input,button{font:inherit;color:inherit}
  input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);outline:none}
  input:focus{border-color:var(--accent)}
  button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px}
  .primary{background:var(--accent);border-color:var(--accent);color:#2a0b27;font-weight:700}

  /* gate */
  #gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
  #gate h1{margin:0 0 6px;font-size:40px;font-weight:800;letter-spacing:-1px}
  #gate h1 span{color:var(--accent)}
  #gate input,#gate button{width:min(340px,90vw);padding:14px 16px;font-size:16px}
  #gateErr{color:var(--bad);min-height:20px;font-size:14px}

  .wrap{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
  h1.top{margin:0 0 18px;font-size:28px;font-weight:800;letter-spacing:-.5px}
  h1.top span{color:var(--accent)}

  /* date + quiz picker */
  .pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .pick input[type=date]{width:auto;color-scheme:dark}
  .types{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .type{display:flex;align-items:center;gap:8px;color:var(--dim)}
  .type .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}
  .type.filled .dot{background:currentColor}
  .type.on{color:var(--text);border-color:var(--text)}
  #status{font-size:14px;color:var(--dim);min-height:22px;margin-bottom:14px}
  #status.live{color:var(--bad);font-weight:700}

  .cols{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  label.f{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  label.f input{margin-top:4px;font-size:15px;text-transform:none;letter-spacing:0;color:var(--text)}
  .link{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:22px 1fr 1fr 1fr;gap:6px;align-items:center}
  .link.flag{border-color:var(--warn)}
  .link .n{color:var(--faint);font-weight:700;text-align:center}
  .link .ans{border-color:#2f6e4e}
  .link .ex{grid-column:2/5;font-size:14px}

  .preview{background:var(--app);border-radius:16px;padding:14px;position:sticky;top:12px}
  .preview .h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .pv{margin-bottom:10px}
  .pv .clue{font-weight:800;text-transform:uppercase;font-size:13px;margin-bottom:5px}
  .pv .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .pv .o{background:var(--appbtn);border-radius:9px;padding:7px 4px;text-align:center;font-size:12px;min-height:34px;display:flex;align-items:center;justify-content:center;word-break:break-word}

  #warnings{margin:12px 0;font-size:14px}
  #warnings div{color:var(--warn);padding:2px 0}
  #warnings .ok{color:var(--good)}
  .bar{display:flex;gap:10px;align-items:center;margin-top:8px}
  .bar .grow{flex:1}
  #save{padding:12px 28px;font-size:16px}

  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;max-width:400px;padding:20px}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog .danger{background:rgba(255,107,129,.12);color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:700;margin-bottom:10px}
  dialog menu{display:flex;justify-content:flex-end;gap:8px;padding:0;margin:16px 0 0}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600}

  @media (max-width:820px){
    .cols{grid-template-columns:1fr}
    .preview{position:static}
    .link{grid-template-columns:20px 1fr}
    .link .ex{grid-column:2}
  }
</style>
</head>
<body>

<div id="gate">
  <h1>Puzzle <span>Maker</span></h1>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="enter" class="primary">Enter</button>
  <div id="gateErr"></div>
</div>

<div id="app" class="wrap hidden">
  <h1 class="top">Puzzle <span>Maker</span></h1>

  <div class="pick">
    <button id="prev" aria-label="Previous day">‹</button>
    <input id="date" type="date">
    <button id="next" aria-label="Next day">›</button>
  </div>
  <div class="types" id="types"></div>
  <div id="status"></div>

  <div class="cols">
    <div>
      <div class="row2">
        <label class="f">Keystone <input id="key"></label>
        <label class="f">Author <input id="author"></label>
      </div>
      <div id="links"></div>
      <div id="warnings"></div>
      <div class="bar">
        <button id="clear">Clear</button>
        <span class="grow"></span>
        <button id="save" class="primary">Save</button>
      </div>
    </div>
    <div class="preview">
      <div class="h">Player view</div>
      <div id="pv"></div>
    </div>
  </div>
</div>

<dialog id="dlg">
  <form method="dialog">
    <div id="dlgBody"></div>
    <menu>
      <button value="no">Cancel</button>
      <button value="ok" id="dlgOk" class="primary">OK</button>
    </menu>
  </form>
</dialog>
<div id="toast" class="hidden"></div>

<script>
const FN = 'https://kfqbutzmgomvxywwqenp.supabase.co/functions/v1/puzzlemaker';
const TYPES = [['trivial','trivial'],['popsicle','popsical'],['sportle','sportal'],['literal','literal'],['global','global']];
const ART = /^(a|an|the)\s+/i;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

let password = sessionStorage.getItem('pm_pw') || '';
let date = new Date(); date.setDate(date.getDate() + 1);   // start on tomorrow
let type = 'trivial';
let info = {};          // what's saved for the shown date, per quiz
let dirty = false;
let p = blank();

function blank() { return { keystone: '', author: '', links: Array.from({length: 7}, () => ({answer: '', wrong1: '', wrong2: '', explanation: ''})) }; }
const pad = (n) => String(n).padStart(2, '0');
const keyOf = (d) => `game_${pad(d.getMonth() + 1)}-${pad(d.getDate())}-${d.getFullYear()}`;
const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
// The app uses each phone's local date, so a day is live once it starts anywhere (UTC+14).
const isLive = (d) => isoOf(d) <= new Date(Date.now() + 14 * 3600e3).toISOString().slice(0, 10);

async function call(body) {
  const r = await fetch(FN, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ password, ...body }) });
  const data = await r.json().catch(() => ({ error: 'Server error' }));
  if (r.status === 401) sessionStorage.removeItem('pm_pw');
  if (!r.ok) throw new Error(data.error || 'Error');
  return data;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2800); }
function ask(html, ok = 'OK', { danger = false } = {}) {
  return new Promise((res) => {
    const d = $('#dlg');
    $('#dlgBody').innerHTML = html;
    $('#dlgOk').textContent = ok;
    $('#dlgOk').style.background = $('#dlgOk').style.borderColor = danger ? 'var(--bad)' : '';
    d.returnValue = 'no';
    d.onclose = () => res(d.returnValue === 'ok');
    d.showModal();
  });
}

// ---------- load ----------
// Lock the form while loading so nothing typed gets overwritten.
let loadId = 0;
function setLoading(on) {
  document.querySelectorAll('.cols input, #save, #clear').forEach((el) => (el.disabled = on));
  $('.cols').style.opacity = on ? 0.5 : '';
  if (on) { $('#status').className = ''; $('#status').textContent = 'Loading…'; }
}
async function loadDate() {
  const id = ++loadId;
  $('#date').value = isoOf(date);
  setLoading(true);
  const r = await call({ action: 'status', dates: [keyOf(date)] }).then((r) => r[keyOf(date)]).catch((e) => (toast(e.message), {}));
  if (id !== loadId) return;
  info = r;
  await loadPuzzle(id);
}
async function loadPuzzle(id = ++loadId) {
  setLoading(true);
  const rows = info[type] ? await call({ action: 'get', date: keyOf(date), type }).catch((e) => (toast(e.message), [])) : [];
  if (id !== loadId) return;
  renderTypes();
  p = blank();
  for (const r of rows) {
    if (r.question_number === 1) p.keystone = r.first_word || '';
    p.author ||= r.author || '';
    p.links[r.question_number - 1] = { answer: r.right_answer, wrong1: r.wrong_option_1, wrong2: r.wrong_option_2, explanation: r.explanation || '' };
  }
  dirty = false;
  renderForm();
  setLoading(false);
}
async function okToLeave() { return !dirty || ask('<p>Discard your changes?</p>', 'Discard'); }

// ---------- render ----------
function renderTypes() {
  $('#types').innerHTML = TYPES.map(([id, label]) =>
    `<button class="type ${info[id] ? 'filled' : ''} ${id === type ? 'on' : ''}" data-t="${id}" style="--c:var(--${id})"><span class="dot" style="color:var(--${id})"></span>${label}</button>`).join('');
  const s = $('#status');
  const cur = info[type];
  s.className = cur && isLive(date) ? 'live' : '';
  s.textContent = !cur ? 'Empty' : (isLive(date) ? 'Live · ' : '') + `by ${cur.author || '?'}`;
}
function renderForm() {
  $('#key').value = p.keystone;
  $('#author').value = p.author;
  $('#links').innerHTML = p.links.map((l, i) => `
    <div class="link" data-i="${i}">
      <span class="n">${i + 1}</span>
      <input class="ans" data-f="answer" placeholder="Answer" value="${esc(l.answer)}">
      <input data-f="wrong1" placeholder="Wrong" value="${esc(l.wrong1)}">
      <input data-f="wrong2" placeholder="Wrong" value="${esc(l.wrong2)}">
      <input class="ex" data-f="explanation" placeholder="Explanation" value="${esc(l.explanation)}">
    </div>`).join('');
  renderLive();
}
function renderLive() {
  // player view, same button order as the app
  let clue = p.keystone;
  $('#pv').innerHTML = p.links.map((l, i) => {
    const opts = shuffle([l.answer, l.wrong1, l.wrong2], `${keyOf(date)}|${type}|${i + 1}`);
    const h = `<div class="pv"><div class="clue">${esc(clue) || '…'}</div><div class="opts">${opts.map((o) => `<div class="o">${esc(o) || '&nbsp;'}</div>`).join('')}</div></div>`;
    clue = l.answer;
    return h;
  }).join('');
  const w = warnings();
  document.querySelectorAll('.link').forEach((el) => el.classList.toggle('flag', w.some((x) => x.n === +el.dataset.i + 1)));
  $('#warnings').innerHTML = w.length ? w.map((x) => `<div>${x.n ? `Link ${x.n}: ` : ''}${esc(x.m)}</div>`).join('') : '<div class="ok">✓ Looks good</div>';
}

// ---------- checks (warn only) ----------
function warnings() {
  const out = [], add = (n, m) => out.push({ n, m });
  const lc = (x) => x.trim().toLowerCase();
  if (!p.keystone.trim()) add(0, 'Keystone missing');
  if (!p.author.trim()) add(0, 'Author missing');
  const seen = new Set();
  p.links.forEach((l) => { const a = lc(l.answer); if (a && seen.has(a)) add(0, `"${l.answer}" used twice`); seen.add(a); });
  if (p.keystone && seen.has(lc(p.keystone))) add(0, 'Keystone repeats as an answer');
  p.links.forEach((l, i) => {
    const n = i + 1, o = [l.answer, l.wrong1, l.wrong2].map((x) => x.trim());
    if (o.some((x) => !x) || !l.explanation.trim()) return add(n, 'Not filled in');
    if (new Set(o.map((x) => x.toLowerCase())).size < 3) add(n, 'Two buttons match');
    const arts = o.filter((x) => ART.test(x)).length;
    if (arts === 1 && ART.test(o[0])) add(n, 'Only the answer has The/A');
    if (arts === 2 && !ART.test(o[0])) add(n, 'Only the answer lacks The/A');
    const ex = ' ' + lc(l.explanation) + ' ';
    if (lc(l.answer).split(/\s+/).some((w) => w.length > 3 && ex.includes(' ' + w))) add(n, 'Explanation gives away the answer');
  });
  return out;
}

// same seeded shuffle as the app (src/game/engine.ts)
function shuffle(arr, seed) {
  let h = 2166136261; for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  let a = h >>> 0;
  const rnd = () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const out = [...arr];
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}

// ---------- events ----------
$('#links').oninput = (e) => { const c = e.target.closest('.link'); p.links[+c.dataset.i][e.target.dataset.f] = e.target.value; dirty = true; renderLive(); };
$('#key').oninput = (e) => { p.keystone = e.target.value; dirty = true; renderLive(); };
$('#author').oninput = (e) => { p.author = e.target.value; dirty = true; renderLive(); };
$('#types').onclick = async (e) => {
  const b = e.target.closest('.type'); if (!b || b.dataset.t === type || !(await okToLeave())) return;
  type = b.dataset.t; renderTypes(); loadPuzzle();
};
async function moveTo(d) { if (!(await okToLeave())) { $('#date').value = isoOf(date); return; } date = d; loadDate(); }
$('#date').onchange = (e) => { const [y, m, d] = e.target.value.split('-'); if (y) moveTo(new Date(+y, m - 1, +d)); };
$('#prev').onclick = () => { const d = new Date(date); d.setDate(d.getDate() - 1); moveTo(d); };
$('#next').onclick = () => { const d = new Date(date); d.setDate(d.getDate() + 1); moveTo(d); };
$('#clear').onclick = async () => { if (await ask('<p>Clear all fields?</p>', 'Clear')) { p = blank(); dirty = true; renderForm(); } };

$('#save').onclick = async () => {
  const w = warnings();
  if (w.length && !(await ask(`<p>${w.length} warning${w.length > 1 ? 's' : ''}. Save anyway?</p>`, 'Save anyway'))) return;
  const cur = info[type];
  if (cur && isLive(date)) {
    if (!(await ask('<div class="danger">This puzzle is live. People may have already played it.</div><p>Replace it for everyone?</p>', 'Replace live puzzle', { danger: true }))) return;
  } else if (cur) {
    if (!(await ask(`<p>Replace the puzzle by ${esc(cur.author || '?')}?</p>`, 'Replace'))) return;
  }
  const btn = $('#save'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await call({ action: 'save', puzzle: { game_date: keyOf(date), quiz_type: type, ...p } });
    dirty = false;
    toast('Saved');
    info = await call({ action: 'status', dates: [keyOf(date)] }).then((r) => r[keyOf(date)]);
    renderTypes();
  } catch (e) { toast(e.message); }
  btn.disabled = false; btn.textContent = 'Save';
};
window.onbeforeunload = () => (dirty ? true : undefined);

// ---------- gate ----------
async function enter() {
  password = $('#pw').value || password;
  try {
    await call({ action: 'status', dates: [] });
    sessionStorage.setItem('pm_pw', password);
    $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
    loadDate();
  } catch (e) { $('#gateErr').textContent = e.message; }
}
$('#enter').onclick = enter;
$('#pw').onkeydown = (e) => e.key === 'Enter' && enter();
if (password) enter();
</script>
</body>
</html>
