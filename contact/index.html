<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diab "Dody" Eid — Contact</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #F7F4EF;
    --ink: #1A1814;
    --ink-light: #6B6760;
    --rule: #D9D4CB;
    --accent: #2C4A3E;
    --accent-light: #4A7A68;
  }
  html, body { height: 100%; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 5rem 2rem 3rem;
  }
  .page { width: 100%; max-width: 560px; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); filter: blur(4px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0);   }
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.6rem, 6vw, 3.8rem);
    font-weight: 300;
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-bottom: 0.3rem;
    opacity: 0;
    animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
  }
  h1 em { font-style: normal; color: inherit; }
  .credential {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    font-weight: 300;
    color: var(--ink-light);
    letter-spacing: 0.04em;
    line-height: 1.7;
    margin-bottom: 1.25rem;
    opacity: 0;
    animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.20s forwards;
  }
  .rule {
    width: 40px; height: 1px; background: var(--accent); margin-bottom: 2.5rem;
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.34s forwards;
  }
  .contacts { list-style: none; display: flex; flex-direction: column; gap: 0; }
  .contacts li {
    display: flex;
    align-items: baseline;
    gap: 1.5rem;
    padding: 1rem 0;
    border-bottom: 1px solid var(--rule);
    opacity: 0;
  }
  .contacts li:last-child { border-bottom: none; }
  .contacts li:nth-child(1) { animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.46s forwards; }
  .contacts li:nth-child(2) { animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.58s forwards; }
  .contacts li:nth-child(3) { animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.70s forwards; }
  .contact-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-light);
    min-width: 72px;
    padding-top: 2px;
  }
  .contact-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 300;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  .contact-value a { color: inherit; text-decoration: none; transition: color 0.2s; }
  .contact-value a:hover { color: var(--accent-light); }
  .footer {
    margin-top: 2.5rem;
    font-size: 11px;
    color: var(--ink-light);
    letter-spacing: 0.05em;
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.84s forwards;
  }
  @media (max-width: 480px) {
    .contacts li { flex-direction: column; gap: 0.3rem; }
    .contact-label { min-width: unset; }
  }
</style>
</head>
<body>
<main class="page">
  <h1>Diab &#8220;Dody&#8221; <em>Eid</em></h1>
  <p class="credential">
    M.B.A., University of Notre Dame<br>
    A.B., Economics, Harvard University
  </p>
  <div class="rule"></div>
  <ul class="contacts">
    <li>
      <span class="contact-label">Email</span>
      <span class="contact-value"><a href="mailto:dody@dodyeid.com">dody@dodyeid.com</a></span>
    </li>
    <li>
      <span class="contact-label">Phone</span>
      <span class="contact-value">(617) 396-4224</span>
    </li>
    <li>
      <span class="contact-label">LinkedIn</span>
      <span class="contact-value"><a href="https://linkedin.com/in/eidd" target="_blank" rel="noopener">linkedin.com/in/eidd</a></span>
    </li>

  </ul>
  <p class="footer">Boston, MA &nbsp;·&nbsp; Updated May 2026</p>
</main>
</body>
</html>
